query CartInput {
  cart {
    lines {
      id
      quantity
      merchandise {
        __typename
        ... on ProductVariant {
          product {
            metafield(namespace: "compliance", key: "case_discount_eligible") {
              value
            }
          }
        }
      }
    }
  }
  discount {
    metafield(namespace: "$app", key: "function-configuration") {
      jsonValue
    }
  }
}

